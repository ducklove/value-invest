name: Broker connection diagnostics

on:
  workflow_dispatch:
    inputs:
      subscription_probe:
        description: Check one quote registration using cached tokens (no token renewal)
        type: boolean
        default: false
      refresh_token:
        description: Renew linked NH cached tokens once to recover stale sessions
        type: boolean
        default: false
      release_stale:
        description: Check deregistration on an otherwise rejected NH session
        type: boolean
        default: false
      isolate_service:
        description: Stop the app for 120 seconds, probe one cached-token subscription, then restore it
        type: boolean
        default: false
      deep_probe:
        description: Compare cached-token REST and direct WebSocket protocol without preliminary TLS sockets
        type: boolean
        default: false
      inventory_only:
        description: Read process, container connection and proxy metadata only
        type: boolean
        default: false
      official_sdk:
        description: Compare the pinned official NH SDK in a temporary dependency directory
        type: boolean
        default: false
      reset_sessions:
        description: Clear this appkey's stale WebSocket sessions using the official recovery API
        type: boolean
        default: false
      manage_sessions:
        description: Enable recovery for the sole linked NH key confirmed to be exclusive to this service
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, home-server]
    timeout-minutes: 5
    steps:
      - name: Read sanitized broker errors and check NH TLS
        env:
          SUBSCRIPTION_PROBE: ${{ inputs.subscription_probe }}
          REFRESH_TOKEN: ${{ inputs.refresh_token }}
          RELEASE_STALE: ${{ inputs.release_stale }}
          ISOLATE_SERVICE: ${{ inputs.isolate_service }}
          DEEP_PROBE: ${{ inputs.deep_probe }}
          NH_INVENTORY_ONLY: ${{ inputs.inventory_only }}
          OFFICIAL_SDK: ${{ inputs.official_sdk }}
          NH_RESET_SESSIONS: ${{ inputs.reset_sessions }}
          NH_MANAGE_SESSIONS: ${{ inputs.manage_sessions }}
        run: |
          cd "${APP_DIR:-/home/cantabile/Works/value_invest}"
          git fetch --quiet origin master
          nh_probe_dir=""
          nh_service_stopped=false
          cleanup() {
            if [ "$nh_service_stopped" = "true" ]; then sudo /bin/systemctl start value-invest.service; fi
            if [ -n "$nh_probe_dir" ]; then rm -rf -- "$nh_probe_dir"; fi
          }
          trap cleanup EXIT
          if [ "$NH_RESET_SESSIONS" = "true" ]; then export DEEP_PROBE=true; fi
          if [ "$NH_MANAGE_SESSIONS" = "true" ]; then export DEEP_PROBE=true; fi
          if [ "$OFFICIAL_SDK" = "true" ]; then
            nh_probe_dir=$(mktemp -d /tmp/value-invest-nh-sdk.XXXXXX)
            export NH_SDK_PROBE_DIR="$nh_probe_dir" DEEP_PROBE=true
            curl -fsSL https://raw.githubusercontent.com/PLUG-OpenAPI/nhplug-sdk/13866ff45dadb25d89e7e68db69ffe79620b198a/nhplug/realtime.py -o "$nh_probe_dir/realtime.py"
            printf '%s\n' 'websocket-client==1.9.2 --hash=sha256:e1a673830a9c7bfa47b1cd3d5e4178f4c9651d80a4eab02c9c23a1c3ec6250ce' > "$nh_probe_dir/requirements.txt"
            .venv-current/bin/python -m pip install --quiet --no-deps --only-binary=:all: --require-hashes --target "$nh_probe_dir/deps" -r "$nh_probe_dir/requirements.txt"
          fi
          if [ "$DEEP_PROBE" = "true" ] && [ "$ISOLATE_SERVICE" = "true" ]; then
            git show origin/master:deploy/nh-protocol-diagnostics.py | NH_INVENTORY_ONLY=true .venv-current/bin/python -
          fi
          if [ "$ISOLATE_SERVICE" = "true" ]; then
            nh_service_stopped=true
            sudo /bin/systemctl stop value-invest.service
            if [ "$NH_RESET_SESSIONS" = "true" ]; then sleep 2; else sleep 120; fi
            export SUBSCRIPTION_PROBE=true REFRESH_TOKEN=false RELEASE_STALE=false
          fi
          if [ "$DEEP_PROBE" = "true" ] || [ "$NH_INVENTORY_ONLY" = "true" ]; then
            git show origin/master:deploy/nh-protocol-diagnostics.py | .venv-current/bin/python -
          else
            git show origin/master:deploy/broker-diagnostics.py | .venv-current/bin/python -
          fi
      - name: Restore app after isolated probe
        if: ${{ always() && inputs.isolate_service }}
        run: sudo /bin/systemctl start value-invest.service
