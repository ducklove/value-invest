name: Broker connection diagnostics

on:
  workflow_dispatch:
    inputs:
      subscription_probe:
        description: Check one quote registration using cached tokens (no token renewal)
        type: boolean
        default: false
      refresh_token:
        description: Renew linked NH cached tokens once to recover stale sessions
        type: boolean
        default: false
      release_stale:
        description: Check deregistration on an otherwise rejected NH session
        type: boolean
        default: false
      isolate_service:
        description: Stop the app for 120 seconds, probe one cached-token subscription, then restore it
        type: boolean
        default: false
      deep_probe:
        description: Compare cached-token REST and direct WebSocket protocol without preliminary TLS sockets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, home-server]
    timeout-minutes: 5
    steps:
      - name: Read sanitized broker errors and check NH TLS
        env:
          SUBSCRIPTION_PROBE: ${{ inputs.subscription_probe }}
          REFRESH_TOKEN: ${{ inputs.refresh_token }}
          RELEASE_STALE: ${{ inputs.release_stale }}
          ISOLATE_SERVICE: ${{ inputs.isolate_service }}
          DEEP_PROBE: ${{ inputs.deep_probe }}
        run: |
          cd "${APP_DIR:-/home/cantabile/Works/value_invest}"
          git fetch --quiet origin master
          if [ "$DEEP_PROBE" = "true" ] && [ "$ISOLATE_SERVICE" = "true" ]; then
            git show origin/master:deploy/nh-protocol-diagnostics.py | NH_INVENTORY_ONLY=true .venv-current/bin/python -
          fi
          if [ "$ISOLATE_SERVICE" = "true" ]; then
            trap 'sudo /bin/systemctl start value-invest.service' EXIT
            sudo /bin/systemctl stop value-invest.service
            sleep 120
            export SUBSCRIPTION_PROBE=true REFRESH_TOKEN=false RELEASE_STALE=false
          fi
          if [ "$DEEP_PROBE" = "true" ]; then
            git show origin/master:deploy/nh-protocol-diagnostics.py | .venv-current/bin/python -
          else
            git show origin/master:deploy/broker-diagnostics.py | .venv-current/bin/python -
          fi
      - name: Restore app after isolated probe
        if: ${{ always() && inputs.isolate_service }}
        run: sudo /bin/systemctl start value-invest.service
